name: Telemetry Tests

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  backend-telemetry-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve project paths
        shell: bash
        run: |
          if [ -f "Backend/requirements.txt" ] && [ -d "Backend/tests" ]; then
            echo "APP_DIR=Backend" >> "$GITHUB_ENV"
          elif [ -f "requirements.txt" ] && [ -d "tests" ]; then
            echo "APP_DIR=." >> "$GITHUB_ENV"
          else
            echo "Could not find requirements.txt/tests in Backend or repository root."
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "${APP_DIR}/requirements.txt"

      - name: Run telemetry test suite
        run: |
          python -m unittest discover -s "${APP_DIR}/tests" -p "test_*.py" -v

